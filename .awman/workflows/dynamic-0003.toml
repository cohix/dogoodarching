title = "0003: Coach Today, coach navigation, team Fuel meals and athlete detail layout"

agent = "claude"
teardown_on_failure = false

# ── Setup ─────────────────────────────────────────────────────────────────────

[[setup]]
type = "run_shell"
command = "npm ci"
abort_on_failure = true

# ── Agent steps ───────────────────────────────────────────────────────────────
#
#   server ──┬── worker-tests ───┐
#            ├───────────────────┼── docs ──┐
#   frontend ┴── frontend-tests ─┘          ├── review
#                                           │
#   (server and frontend run in parallel; they touch disjoint trees:
#    src/ + migrations/ vs frontend/)

[[step]]
name = "server"
abort_on_failure = true
prompt = """
You are implementing the SERVER half of work item {{work_item_number}} in this
Cloudflare Workers + Hono + Drizzle/D1 repository. A separate agent is building the
frontend (`frontend/`) at the same time, and later agents write tests and docs.

Scope — touch ONLY `src/`, `migrations/` (including drizzle meta generated by
`npm run db:generate`), and nothing under `frontend/`, `test/`, `aspec/` or `README.md`.
Do NOT write or edit tests. Do NOT edit documentation.

Read first: `aspec/architecture/design.md`, `aspec/architecture/security.md`
("RBAC", "API security"), `aspec/architecture/apis.md`, `aspec/devops/operations.md`
(migration operations), `src/services/dashboard.ts` (`getCoachOverview`,
`loadPlanAndAggregates`, `loadProgramState`), `src/routes/coach.ts`,
`src/routes/tracker.ts`, `src/routes/transfer.ts`, `src/lib/rbac.ts`,
`src/lib/validation.ts`, `src/services/team.ts` (`listAthletes`), the blob cleanup
helpers (`enqueueBlobCleanupFromAttachments`), and the existing migrations
(latest applied is `0006_import_mapping.sql`).

Implement these sections of the work item exactly:
- §2 Server: `GET /api/coach/overview?today=YYYY-MM-DD` with the exact response
  shape, one shared helper for cycleArrows / averagePerWeek / cycleSessions /
  averagePerSession (null when zero sessions; unrounded), active athletes only ordered
  by display name then username, batched grouped queries with a query count constant in
  the number of athletes, ID lists chunked to stay under D1's bound-parameter limit,
  same privacy projection as `getCoachOverview` (never `getTrackerPayload`; never read
  notes/focus/score/scores/weekly notes/setups/maintenance/milestones/inspiration).
  Share the week/day-status computation with `loadPlanAndAggregates` instead of
  duplicating it; leave the per-athlete overview response unchanged. Athletes without a
  program_state row use `loadProgramState` defaults.
- §3 Server: `team_meals` table in `src/db/schema.ts` + migration via
  `npm run db:generate`; `src/services/team-meals.ts`; coach routes
  GET/POST/PUT/DELETE `/api/coach/meals[/:id]` (404 on missing id for PUT/DELETE,
  any coach may edit/delete any meal, PUT sets updated_by/updated_at, last write wins);
  a shared recipe schema in `src/lib/validation.ts` reused by `inspirationInput`;
  existing coach-write rate limit + validateJson/CSRF handling. Merge team meals into
  the athlete tracker payload `recipes[]` with `source: "own" | "team"`, stable
  `key` (`own:<id>` / `team:<id>`), newest-first by created_at (edits don't reorder),
  author shown only by display name or "Coach" if deleted, never author ids.
  `inspiration` stays the athlete's newest own row. Export excludes team meals; import
  never creates or deletes them; export version 1 stays compatible.
- §5 Server: `requireAthlete` in `src/lib/rbac.ts`, applied to every personal tracker
  route listed in §5 and to `/api/export` + `/api/import` (403, standard JSON error
  body). `/api/auth/*`, `/api/me`, settings/account routes and `/api/coach/*` unaffected;
  coach writes into athlete plans keep working. Confirm bootstrap and coach-invite
  acceptance never seed personal rows for coaches (fix if they do).
- §5 Data removal migration (numbered after the team-meals migration, or combined):
  delete every coach's rows in all listed personal tables (children before parents
  where FKs don't cascade), delete upload_reservations where user_id is a coach but
  keep ones where only actor_id is a coach, and first insert the coach-owned attachment
  blob keys into `blob_cleanup` (reason `coach-data-removal`, next_attempt_at =
  migration time) mirroring `enqueueBlobCleanupFromAttachments`. Never queue blobs
  referenced by athlete rows. No backup/runbook steps.

Keep routes thin; logic goes in `src/services/`. Follow existing conventions.

Full work item for reference:
{{work_item_content}}

Success criteria (check them yourself before finishing):
- `npm run db:generate` produces no further diff and `npm run db:check` passes.
- `tsc --noEmit -p tsconfig.worker.json` and `npm run lint` pass for your files.
- `npm run test:worker` still runs; tests that fail ONLY because of intentional
  behaviour changes (e.g. the rbac "coaches get their own, empty tracker" assertion)
  may be left for the tests step — list them in your notes.

When done, write `/awman/context/workflow/server-notes.md` containing: every new/changed
route with its exact request/response JSON shapes (the frontend and tests steps rely on
this), the new migration filenames and what each does, the shared helper names and file
locations, the query-count/chunking strategy, any personal routes you gated, and any
existing tests you expect to break and why.
"""

[[step]]
name = "frontend"
abort_on_failure = true
prompt = """
You are implementing the FRONTEND half of work item {{work_item_number}} in this
React + Vite + TanStack Query + Tailwind SPA (`frontend/`). A separate agent is
implementing the server (`src/`, `migrations/`) at the same time; code against the API
contracts written in the work item — they are authoritative. If
`/awman/context/workflow/server-notes.md` already exists, read it, but do not wait for it.

Scope — touch ONLY files under `frontend/`. Do NOT edit `src/`, `migrations/`,
`test/`, `aspec/` or `README.md`. Do NOT write tests. Do NOT add a client router or
URL routing.

Read first: `aspec/uxui/interface.md`, `aspec/uxui/experience.md`,
`frontend/src/components/navigation.ts`, `frontend/src/App.tsx` (`TrackerShell`),
`frontend/src/api.ts`, `features/dashboard/Dashboard.tsx`, `features/fuel/Nutrition.tsx`,
`features/team/TeamTab.tsx` (`AthleteDetail`, `CycleSummaryCard`, `PlanEditor`),
`ArrowHistoryModal`, `features/settings/SettingsTab.tsx`, and the local-calendar `today`
helper and existing query-key invalidation patterns.

Implement these sections of the work item exactly:
- §1 Navigation: `coachNav` = Today, Fuel, Team, Settings with marks "01"–"04";
  `athleteNav` unchanged. Replace the grid-cols switch with a mapping from `nav.length`
  covering 4 and 6 using literal Tailwind class names. Gate tab bodies by role: a coach
  never mounts Dashboard, TrainingLog, TrainingPlan or BowAndGear, and stale tab state
  falls back to `dashboard` (the coach Today view). Remove the header poundage label for
  both roles; athletes keep the Today "History" button; coaches have no header action.
  The coach shell never requests `/api/tracker`; athlete loading is unchanged.
- §2 Client: `api.coachOverview(today)`; new `features/coach/CoachToday.tsx` with one
  card per athlete (name, "Cycle X, Week Y", the 6-week grid via a shared component —
  reuse `CycleSummaryCard` or extract the Dashboard hero grid; don't fork markup —
  cycle arrows, average / week, average / session showing "—" for null, poundage or
  "Poundage not set"; round for display only). Tapping a card switches to Team with that
  athlete's detail open (TeamTab accepts a selected athlete id from the shell, in-app
  state); "Back to team" returns to the Team list. Empty state points to Team → invite;
  loading/error match other coach queries. Invalidate the new query key alongside
  `coach-overview` wherever a coach edits a plan or (de)activates an athlete.
- §3 Client: coach Fuel view with an "Add meal" form above the team meal list, reusing
  the existing card and details modal; edit (prefilled same form) and delete (with
  confirmation) per card; refetch after each save. Athlete Fuel: same layout, team meals
  labelled "From your coach", React keys from `key`, updated intro copy. Render all
  meal text as text, never HTML. An open details modal reflects refetched/removed state.
- §4 AthleteDetail order: back link, athlete header, current cycle summary, arrows
  summary ("N arrows across M logged weeks", may still open the modal), inline
  arrows-by-week chart, PlanEditor, "Earlier cycles" (hidden when only one cycle).
  Extract the recharts chart from `ArrowHistoryModal` into a shared component used by
  both the modal and the inline view; show an empty state (not a blank/zero-height chart)
  when there are no logged weeks.
- §5 Client: hide export/import in Settings for coaches; keep account controls.

Full work item for reference:
{{work_item_content}}

Success criteria:
- `tsc --noEmit -p frontend/tsconfig.json` and `npm run lint` pass.
- `npm run test:frontend` still runs; tests that fail only because of intentional
  changes (e.g. asserting the header poundage pill) may be left for the tests step —
  list them in your notes.

When done, write `/awman/context/workflow/frontend-notes.md` listing new/changed
components and their file paths, new shared components (grid, arrows chart), how the
shell passes the selected athlete into TeamTab, query keys added, and existing tests you
expect to break and why.
"""

[[step]]
name = "worker-tests"
depends_on = ["server"]
prompt = """
Write and update WORKER tests for work item {{work_item_number}}. The server
implementation is done; read `/awman/context/workflow/server-notes.md` first, then the
diff under `src/` and `migrations/`.

Scope — touch ONLY `test/worker/` (and shared test helpers under `test/` that only the
worker project uses). Do NOT modify `src/`, `migrations/` or `frontend/`. If you find a
genuine server bug, do not fix it; record it in
`/awman/context/workflow/worker-tests-notes.md` with a failing test that demonstrates it.
Do not touch `test/frontend/` — another agent is working there concurrently.

Use the existing Vitest + `@cloudflare/vitest-plugin` harness, the `api()` helper, and
the `RATE_LIMIT_MODE` conventions described in `aspec/devops/localdev.md`.

Cover the Worker items from the work item's test plan:
{{work_item_section:[Test Considerations]}}

And these edge cases (server-side ones):
{{work_item_section:[Edge Case Considerations]}}

Specifically: extend `coach-overview.test.ts` projection/table-access assertions to the
new overview function; assert constant query count as athletes increase and use enough
athletes to exceed the D1 bound-parameter limit; replace the "coaches get their own,
empty" assertion in `rbac.test.ts` with 403s on every personal route and export/import;
meal CRUD, 404s, cross-coach edit/delete, updated_by, CSRF on unsafe routes, rate-limit
binding selection, author deletion → NULL author and "Coach"; payload merge ordering
with source/key and unchanged `inspiration`; export/import excluding team meals;
migration tests on empty and populated DBs including blob_cleanup queueing, athlete rows
and coach uploads into athlete plans untouched, and clean `PRAGMA foreign_key_check`.

Success criteria: `npm run test:worker` passes (except tests documenting a real server
bug, which you must list in your notes), and `tsc --noEmit -p test/worker/tsconfig.json`
and `npm run lint` pass. Write `/awman/context/workflow/worker-tests-notes.md`
mapping each test-plan bullet to the test file/name covering it.
"""

[[step]]
name = "frontend-tests"
depends_on = ["frontend"]
prompt = """
Write and update FRONTEND (jsdom) tests for work item {{work_item_number}}. The frontend
implementation is done; read `/awman/context/workflow/frontend-notes.md` first, then the
diff under `frontend/`.

Scope — touch ONLY `test/frontend/`. Do NOT modify `frontend/`, `src/` or
`test/worker/` (another agent is working in `test/worker/` concurrently). If you find a
genuine frontend bug, do not fix it; record it in
`/awman/context/workflow/frontend-tests-notes.md` with a failing test demonstrating it.

Cover the Frontend items from the work item's test plan:
{{work_item_section:[Test Considerations]}}

Including: coach nav renders exactly Today, Fuel, Team, Settings and Dashboard / Log /
Plan / Gear are never mounted for a coach (including stale tab state falling back to
Today); athlete nav unchanged; no header poundage label for either role while the
athlete Today header still shows "History" (update existing header-pill tests); the
coach shell never requests `/api/tracker`; CoachToday list with both averages ("—" for
null), empty and error states, tapping a card opens that athlete in Team and "Back to
team" returns to the list; coach Fuel add/edit/delete with confirmation; athlete Fuel
labels team meals "From your coach" and renders a `javascript:` payload as text;
Settings hides export/import for coaches; AthleteDetail order (current cycle, arrows
summary, chart before PlanEditor, earlier cycles after, hidden with one cycle, chart
empty state); ArrowHistoryModal still works in the Log tab using the shared chart.

Success criteria: `npm run test:frontend` passes (except tests documenting a real bug,
listed in your notes), and `tsc --noEmit -p test/frontend/tsconfig.json` and
`npm run lint` pass. Write `/awman/context/workflow/frontend-tests-notes.md` mapping
each test-plan bullet to the covering test.
"""

[[step]]
name = "docs"
depends_on = ["server", "frontend"]
prompt = """
Update documentation for work item {{work_item_number}}. Implementation is complete.
Read `/awman/context/workflow/server-notes.md` and
`/awman/context/workflow/frontend-notes.md`, and the actual diff, so the docs describe
what was built.

Scope — edit ONLY the documents below. Do NOT touch source code, tests, migrations or
the work item file itself. Do not create work-item-specific documents.

Specifically update:
- `aspec/uxui/interface.md` ("Layout": remove the header poundage text; "Menus" and the
  Team description; remove "The personal tabs continue to show the coach's own data").
- `aspec/uxui/experience.md` ("Regular usage", "Invitations and team/group management",
  "Emails, notifications, texts": meals appear in-app, no push notifications).
- `aspec/architecture/apis.md` (team contracts, `/api/coach/overview`,
  `/api/coach/meals` routes, athlete-only personal routes).
- `aspec/architecture/design.md` (principle 3, components 4/5/9, data model incl.
  `team_meals`).
- `aspec/architecture/security.md` (RBAC: `requireAthlete`, the new overview's
  projection rule, coaches write team meals but never read athlete inspiration).
- `aspec/foundation.md` persona table.
- `README.md` (roles table, API overview, export description).

Match the existing tone, density and link style. Success criteria:
`npm run docs:check` passes and no statement in the docs contradicts the code.
"""

[[step]]
name = "review"
agent = "codex"
depends_on = ["worker-tests", "frontend-tests", "docs"]
abort_on_failure = true
prompt = """
You are the independent reviewer for work item {{work_item_number}}. Other agents
implemented the server, frontend, tests and docs. Review the full working-tree diff
against the work item and fix real defects you find directly in the code (keep fixes
minimal and in the style of the surrounding code; add or adjust tests for any fix).

Read the notes in `/awman/context/workflow/` (server-notes.md, frontend-notes.md,
worker-tests-notes.md, frontend-tests-notes.md) first — any bug recorded there by a
test writer must be fixed.

Work item:
{{work_item_content}}

Verify in particular:
- Privacy: the new coach overview never calls `getTrackerPayload` and never selects
  notes, focus, score, scores, weekly notes, setups, maintenance, milestones or
  inspiration; no author ids leak in athlete payloads; coaches never read athlete
  inspiration.
- Query count is constant in athletes and ID lists are chunked under D1's parameter
  limit; `averagePerSession` is null (not 0/NaN) at zero sessions; API numbers unrounded.
- `requireAthlete` covers EVERY personal tracker route and export/import (walk
  `src/routes/tracker.ts` and `src/routes/transfer.ts` route by route); coach routes,
  auth, /api/me and settings unaffected; coach writes into athlete plans still work;
  stale coach clients get 403, not 500.
- The data-removal migration: correct table list and FK order, only coach `user_id`
  upload_reservations removed, blob keys queued with reason `coach-data-removal`,
  athlete blobs never queued, idempotent/no-op for coaches with no data.
- Team meals: validation shared with inspiration recipe rules, CSRF + rate limit on
  unsafe routes, 404s, `ON DELETE SET NULL`, created_at ordering, `inspiration`
  untouched, export/import exclusion.
- Frontend: coach never mounts Dashboard/Log/Plan/Gear, stale tab fallback, no
  `/api/tracker` fetch for coaches, literal Tailwind grid classes for 4 and 6 items, no
  header poundage for either role, text rendered safely (no dangerouslySetInnerHTML),
  query invalidation, AthleteDetail order and shared chart component.
- Edge cases:
{{work_item_section:[Edge Case Considerations]}}
- Docs match the behaviour.

Then run `npm run typecheck`, `npm run lint`, `npm run docs:check`, `npm run db:check`,
`npm test` and `npm run build`, and fix any failures.

Write `/awman/context/workflow/review.md` with: findings (severity, file:line, what you
changed), anything left unfixed and why, and a short manual test plan covering coach
Today, coach Fuel, athlete Fuel, athlete detail, and coach 403s.
"""

# ── Teardown ──────────────────────────────────────────────────────────────────

[[teardown]]
type = "run_shell"
command = "npm run typecheck && npm run lint && npm run docs:check && npm run db:check && npm test && npm run build"
abort_on_failure = true

[teardown.on_failure]
prompt = """
The verification suite (`npm run typecheck && npm run lint && npm run docs:check &&
npm run db:check && npm test && npm run build`) failed after implementing work item
{{work_item_number}}. Run each command, find the root cause of every failure and fix it
in the code (or the test, only if the test is wrong about the behaviour specified in
aspec/work-items/0003-coach-experience.md). Do not delete or skip tests to make them
pass. Re-run the full suite until it is green.
"""
agent = "claude"
max_attempts = 3

[[teardown]]
type = "commit_changes"
message = "Implement {{work_item_number}}: coach Today, coach navigation, team Fuel meals and athlete detail layout"
add_all = true

[[teardown]]
type = "push_branch"
overlays = ["ssh()"]

[[teardown]]
type = "create_pull_request"
title = "Work item {{work_item_number}}: coach experience"
body = "Implements aspec/work-items/0003-coach-experience.md: coach Today team overview, coach-only navigation with athlete-only personal routes and coach data removal migration, team meals in Fuel, reordered Team athlete detail, and removal of the header poundage label. Generated by an awman workflow."
overlays = ["env(GITHUB_TOKEN)"]
