# awman workflow for work item 0002: security hardening (REVIEW.md C2, H2-H5,
# M1-M4, M6). Project: Do Good Arching (Cloudflare Workers + D1 + R2, Hono,
# Drizzle, React SPA; Vitest 4 with @cloudflare/vitest-plugin).
#
# Shape of the run
#   setup: npm ci
#   auth-and-rate-limits (§1 C2, §6 M2) ─┐   coach-overview (§8 M4, dashboard.ts only)
#   request-hardening    (§4, §5, §9)  ◄─┴──────────────┘
#   lifecycle            (§7 M3 backend, cleanup records, cron)
#   uploads              (§3 H4 backend, upload errors §9)
#     ├── import-hardening (§2 H2+H3)         ├── frontend (§3/§5/§7 UI)
#     │     ├── tests-security-auth           │     └── tests-frontend
#     │     └── tests-data-paths              │
#     └──── docs (README + aspec) ◄───────────┘
#   review-backend + review-frontend-docs  (independent reviewers, findings only)
#   remediate  ->  verify-remediation (abort on failure)
#   teardown: typecheck + lint + docs:check + db:check + tests + build, commit, push, PR
#
# The backend implementation steps form one sequential chain because they share
# src/lib/*, src/routes/*, src/db/schema.ts, migrations/, wrangler.toml and the
# test helpers. Each step in the chain may generate its own drizzle-kit
# migration (next number in sequence). Agents alternate between claude and
# codex so that work is tested and reviewed by a different assistant than the
# one that wrote it. No models are set: the agent listing names none, so the
# repo default applies.

title = "0002 Security hardening"
teardown_on_failure = false

# Every agent step gets the run-scoped shared context directory.
overlays = ["context(workflow)"]

# ── Setup ─────────────────────────────────────────────────────────────────────

[[setup]]
type = "run_shell"
command = "npm ci"
abort_on_failure = true

# ── Agent steps ───────────────────────────────────────────────────────────────

[[step]]
name = "auth-and-rate-limits"
agent = "claude"
prompt = '''
You are working on work item {{work_item_number}} (security hardening) in the Do
Good Arching repository (Cloudflare Workers + D1 + R2, Hono, Drizzle, React SPA;
read README.md, REVIEW.md findings C2 and M2, and aspec/architecture/security.md
first). This is the FIRST step of the backend chain. It delivers work item
sections 1 (PBKDF2 iteration count, C2, the production blocker) and 6
(brute-force protection with Workers Rate Limiting bindings, M2).

Current code: `src/lib/auth.ts` (PBKDF2_ITERATIONS = 210000, `hashPassword`,
`verifyPassword`, cookie helpers), `src/services/auth.ts` (login/bootstrap/
invite persistence), `src/lib/rate-limit.ts` (D1 limiter: `clientIp`,
`checkRateLimit`, `rateLimit` middleware), `src/routes/auth.ts` (uses
`rateLimit(keyFor, max, windowMs)`), `src/db/index.ts` (`Env`),
`src/db/schema.ts` + `migrations/` (drizzle-kit; `rate_limits` table),
`wrangler.toml`, `vitest.config.ts`, `test/worker/helpers.ts`,
`test/worker/auth-rate-limit.test.ts`.

DO:
1. Section 1 (C2), exactly as specified: lower PBKDF2_ITERATIONS to 100,000;
   `verifyPassword` reads the count from the stored `pbkdf2$<n>$salt$hash`;
   define and document a minimum supported count (export the constants); reject
   non-integer/malformed counts, counts below the floor or above 100,000, salts
   other than 16 bytes and hashes other than 32 bytes; malformed or empty fields
   fail authentication without throwing and without zero-length comparisons.
   On successful login with a supported lower count, rehash and update
   `password_hash` conditioned on the exact hash that was verified (`UPDATE ...
   WHERE id = ? AND password_hash = ?`) so a concurrent password change is never
   overwritten. Keep comparable password-work cost for unknown users and wrong
   passwords. No local-only 210k exception: 210k hashes fail safely everywhere
   and use the operator reset runbook (the docs step updates the runbook; you
   write the facts it needs in your handoff). Update the comment in
   `vitest.config.ts` that mentions 210k.
2. Section 6 (M2). Replace the D1 limiter with Workers Rate Limiting bindings:
   - `wrangler.toml`: declare `[[ratelimits]]` and `[[env.preview.ratelimits]]`
     with separate 5/min and 10/min bindings (or one per operation) and distinct
     `namespace_id`s for production and preview. Period must be 60 (or 10).
   - `src/db/index.ts`: add the bindings to `Env` with a `RateLimit`-style type
     (`{ limit(options: { key: string }): Promise<{ success: boolean }> }`).
   - `src/lib/rate-limit.ts`: keep `rateLimit(...)` as the shared middleware
     interface (routes never call bindings directly); adapt `checkRateLimit`
     behind it to select the binding by operation and prefix keys. A missing
     binding or a binding error must FAIL CLOSED with a generic `{ error }` 503/500
     style service error, never silently disable limiting. Remove the
     `X-Forwarded-For` fallback from `clientIp`.
   - Starting limits: login per IP 10/min; login per normalized username
     (`login-user:<lower(username)>`) 5/min, checked after validation and before
     hashing with no user lookup; accept-invite per IP 10/min; bootstrap per IP
     5/min; invite creation per coach 10/min. Export a helper the later lifecycle
     and uploads steps can reuse for "uploads per acting user 10/min" and a short
     per-acting-user limit on password verification.
   - Drop the `rate_limits` table: remove it from `src/db/schema.ts` and generate
     a new migration with `npm run db:generate` (next number after
     `0002_team_auth.sql`; never edit 0001/0002). `npm run db:check` must pass.
   - Tests: the binding is not a plain serialisable value, so provide an explicit
     local/test mock. Recommended: the limiter resolves the binding through a
     small injectable seam (for example a test-only `RATE_LIMIT_MODE` binding or
     an overridable factory) so tests can force allow, deny and error paths
     deterministically; document clearly that outside explicit test/local mocks a
     missing binding fails closed. Rewrite `test/worker/auth-rate-limit.test.ts`
     for the new behaviour (429 when the mock denies; both per-IP and
     per-username keys are checked on login; fail-closed when the binding is
     missing/erroring), update the header comment and `resetStorage` in
     `test/worker/helpers.ts` (no `rate_limits` table any more), and make sure the
     existing suites that log in many times per test still pass under the mock.
3. Keep every route thin and preserve `{ error: string }` bodies and existing
   status codes. Preserve 0001's atomic bootstrap and invite-accept batches.

DO NOT:
- Do not implement sections 2, 3, 4, 5, 7, 8 or 9 (CSRF, headers, uploads,
  import, lifecycle, coach overview, error class): later steps own them.
- Do not touch `frontend/`, `aspec/`, `README.md` or `.awman/`.
- Do not edit `src/services/dashboard.ts`: another agent is rewriting it right
  now (coach overview). If `npm run test:worker` shows failures only in a
  coach-overview test file or in dashboard code, that is the other agent's
  in-flight work; retry after a short wait and otherwise ignore it.
- Do not write the comprehensive test suite; add only the tests you need to
  prove the hashing rules and the limiter mock work on D1/workerd. The test
  steps write the full matrix later.

Success criteria you can check yourself:
- `npm run typecheck`, `npm run lint`, `npm run db:check` and `npm run test:worker`
  pass (ignoring only in-flight coach-overview noise as described).
- `grep -rn "210000\|x-forwarded-for" src` finds nothing; `grep -rn "rate_limits" src migrations/*.sql`
  finds only the DROP in your new migration.
- A stored hash with count 100000 verifies; a stored hash with a supported lower
  count verifies and is upgraded exactly once; `pbkdf2$210000$...`, `pbkdf2$abc$..`,
  a 3-part string and an empty string all return false without throwing.
- `npx wrangler deploy --dry-run --env preview` (and without `--env`) parses the
  new bindings; if the dry run needs credentials, at least confirm the config parses.

Before finishing, write `/awman/context/workflow/01-auth-rate-limits.md` for later
steps: the hash format and constants (floor, max), the rehash-on-login rule, the
exact operator-reset facts (what SQL/steps an operator runs to set a new 100k hash
and revoke sessions while keeping data and owner status), the rate-limit binding
names, how `rateLimit(...)` is now called, how to reuse it for uploads and
password-verification endpoints, how the test mock is enabled and how a test
forces deny/error, and any quirk you hit with the vitest plugin.

Work item (full text; also at aspec/work-items/{{work_item_number}}-security-hardening.md):
{{work_item_content}}
'''

[[step]]
name = "coach-overview"
agent = "codex"
prompt = '''
You are working on work item {{work_item_number}} (security hardening) in the Do
Good Arching repository. This step delivers section 8 (coach overview privacy,
REVIEW.md M4) and nothing else. It runs in parallel with another agent that is
editing auth, rate limiting, migrations and wrangler.toml, so your file footprint
must stay tiny.

DO:
- Rewrite `getCoachOverview(db, athleteId, today)` in `src/services/dashboard.ts`
  so it only QUERIES program state, cycle week plans, planned session overrides,
  attachments, and SQL aggregates of arrows per week and distinct session dates.
  It must never select private log columns (session `notes`, `focus`, `score`)
  and never query practice scores, weekly notes, gear/setups, maintenance or
  inspiration tables. Remove its internal call to `getTrackerPayload`. Reuse the
  shared plan/aggregate helpers that `getTrackerPayload` already uses (extract a
  helper if needed, inside `src/services/dashboard.ts` or `src/services/plan.ts`),
  keep 0001's bounded date ranges, null-poundage/default handling and the
  existing five-field response contract exactly (the coach route in
  `src/routes/coach.ts` already calls this service; `frontend/src/api.ts` types
  the response). Aggregates must match what the athlete dashboard shows.
- Add ONE proof test file, `test/worker/coach-overview.test.ts`, that seeds an
  athlete with distinctive strings in notes/focus/score/weekly notes/setups/
  inspiration and asserts (a) the coach overview body contains none of them and
  (b) the queries executed by `getCoachOverview` never reference the private
  tables/columns. For (b), call the service directly with a Drizzle instance
  wrapped by a logger (`drizzle(env.DB, { schema, logger })`) or a D1 proxy that
  records SQL, and assert on the captured statements. A response-only test is
  not enough: it passes the current vulnerable implementation.

DO NOT:
- Do not edit any file other than `src/services/dashboard.ts`, optionally
  `src/services/plan.ts` for a shared helper, and your new test file. Do not
  touch `src/routes/*`, `src/lib/*`, `src/db/*`, `migrations/`, `wrangler.toml`,
  `vitest.config.ts`, `test/worker/helpers.ts`, `frontend/`, `aspec/`, `.awman/`.
- Do not run the whole worker suite as your gate. The other agent is changing
  migrations, wrangler.toml and the test helpers; run only your file
  (`npx vitest run --project worker test/worker/coach-overview.test.ts`) and the
  existing `test/worker/rbac.test.ts` and `test/worker/tracker-*.test.ts` files that
  cover the coach route, retrying after a short wait if a failure clearly comes
  from the concurrent auth/rate-limit work (missing binding, migration churn).

Success criteria:
- `npx tsc --noEmit -p tsconfig.worker.json` and `npm run lint` pass.
- `grep -n "getTrackerPayload" src/services/dashboard.ts` shows only its
  definition and no call inside `getCoachOverview`.
- Your test proves both the body and the query projections are clean, and the
  coach overview numbers equal the athlete dashboard's for the same seed data.

Before finishing, write `/awman/context/workflow/02-coach-overview.md`: which
helpers you extracted, the exact queries the overview now runs, and how the
query-capture assertion works so the later test and review steps can reuse it.

Work item (full text; also at aspec/work-items/{{work_item_number}}-security-hardening.md):
{{work_item_content}}
'''

[[step]]
name = "request-hardening"
agent = "codex"
depends_on = ["auth-and-rate-limits", "coach-overview"]
prompt = '''
You are working on work item {{work_item_number}} (security hardening) in the Do
Good Arching repository. Read `/awman/context/workflow/01-auth-rate-limits.md`
first. This step delivers section 4 (CSRF, H5), section 5 (security headers and
the invite-token fragment, M1) and the shared part of section 9 (the
`UserFacingError` class and `jsonError` status union, M6).

DO:
1. CSRF (section 4), `src/index.ts`, `src/lib/http.ts`, `src/lib/auth.ts`:
   - Add an explicit same-origin guard for ALL unsafe `/api/*` requests (any
     method other than GET/HEAD/OPTIONS), covering JSON, raw upload bodies and
     bodyless logout/delete. Mounting Hono's csrf middleware alone is not enough
     (it only checks form content types); you may add it, but the explicit guard
     is required. Rules: a present Origin that mismatches, or is `null`, gets 403;
     an exact same-origin Origin passes; a missing Origin passes only with
     `Sec-Fetch-Site: same-origin`; neither proof gets 403. Same-site siblings are
     not same-origin. Errors stay `{ error: string }`. Derive the expected origin
     from the request URL (Host/proto as the Worker sees it); document how the
     local Vite dev proxy still passes. If the installed PWA on iOS/Android
     could send neither header, add a verified CSRF-token flow rather than
     failing open; document your decision and evidence.
   - `validateJson` rejects a missing or non-JSON `Content-Type` with 415 BEFORE
     parsing, accepting `application/json` with an optional charset. Only JSON
     endpoints use it; bodyless endpoints stay usable; malformed JSON stays 400.
   - Session cookie: `SameSite=Strict` (invite links do not need Lax).
2. Security headers (section 5):
   - `frontend/public/_headers` with the exact CSP from the work item
     (`default-src 'self'; img-src 'self' blob: data:; frame-src
     https://www.youtube.com https://www.youtube-nocookie.com
     https://player.vimeo.com; object-src 'none'; base-uri 'none';
     frame-ancestors 'none'`), `Referrer-Policy: no-referrer`,
     `Strict-Transport-Security: max-age=31536000; includeSubDomains`,
     `X-Content-Type-Options: nosniff` and a `Permissions-Policy` disabling unused
     features. Confirm Vite copies `frontend/public/` into `dist/client` and that
     Workers Static Assets honours `_headers`. Check the built SPA under the CSP
     (Vite output, the service worker, YouTube/Vimeo embeds, React inline styles,
     Recharts): add only the narrow `style-src` allowance actually needed and never
     relax script restrictions; record what you tested and how.
   - Equivalent headers on every `/api/*` response via `hono/secure-headers`
     (plus the CSP/Referrer/HSTS values above), applied so that error responses
     (404, 500 from `onError`) and direct `Response` downloads also carry them.
   - Invite token to fragment: `invitePath` in `src/routes/auth.ts` becomes
     `/invite#<token>`; `inviteTokenFromPath` in `frontend/src/App.tsx` reads the
     fragment AND still accepts legacy `/invite/<token>` paths, immediately
     calling `replaceState` to remove the token in both cases; update the comment
     in `frontend/sw.js` and check `scripts/service-worker-cache.mjs` and the
     service worker's navigation handling do not strip or cache fragments. Keep
     24-hour expiry and single-use semantics and owner validation of coach invites.
3. Section 9 shared part, `src/lib/http.ts`: add `UserFacingError` (public
   message + HTTP status) and extend `jsonError`'s status union (add 413, 415,
   500 and whatever the CSRF/limiter paths need). Add an `onError` mapping in
   `src/index.ts`: `UserFacingError` -> its status and message; anything else ->
   generic 500 `{ error: "Internal server error" }` logged with `console.error`
   without passwords, raw tokens or request bodies. Applying the class to upload
   errors is done by the uploads step.
4. Tests and helpers: existing tests send no Origin, so make `api()` in
   `test/worker/helpers.ts` send `Origin: http://example.com` by default with an
   option to override/remove it, and keep the whole worker suite green. Add
   focused proof tests (for example `test/worker/csrf.test.ts` and
   `test/worker/headers.test.ts`) for: cross-site, sibling-site and `null`
   Origin -> 403 on JSON, upload and bodyless endpoints; missing Origin with
   `Sec-Fetch-Site: same-origin` passes; neither proof -> 403; `text/plain` or
   missing content type on a JSON endpoint -> 415; malformed JSON -> 400;
   `application/json; charset=utf-8` succeeds; headers present on 200, 404, 500
   and a file download; `invitePath` uses the fragment. Update
   `test/frontend/*` only where the invite-path change breaks an existing test.

DO NOT:
- Do not implement sections 2, 3, 7 or 8, and do not touch `src/services/*`
  except `src/services/attachments.ts` if a download `Response` needs the headers.
- Do not change `frontend/src/api.ts` (browsers send Origin on POST; the
  frontend step owns that file) and do not touch `aspec/`, `README.md` or `.awman/`.
- Do not weaken or skip existing tests to get green.

Success criteria:
- `npm run typecheck`, `npm run lint`, `npm run db:check`, `npm test` and
  `npm run build` pass, and `dist/client/_headers` exists after the build.
- `grep -rn "SameSite=Lax" src` finds nothing; `grep -rn '/invite/\${' src` finds nothing.
- Every proof scenario listed above has a passing test.

Before finishing, write `/awman/context/workflow/03-request-hardening.md`: the
exact CSRF rules and where the guard lives, what the test helper now sends and how
to send a cross-site request in a test, the header set and the `style-src`
decision with evidence, the `UserFacingError` / `jsonError` API and how later
steps should raise expected 400/413/415 errors, the PWA no-Origin decision, and
the invite fragment behaviour for the frontend and docs steps.

Work item (full text; also at aspec/work-items/{{work_item_number}}-security-hardening.md):
{{work_item_content}}
'''

[[step]]
name = "lifecycle"
agent = "claude"
depends_on = ["request-hardening"]
prompt = '''
You are working on work item {{work_item_number}} (security hardening) in the Do
Good Arching repository. Read `/awman/context/workflow/01-auth-rate-limits.md` and
`/awman/context/workflow/03-request-hardening.md` first. This step delivers the
BACKEND of section 7 (account and session lifecycle, M3): password change,
logout-all, account deletion, athlete deactivation/reactivation, ownership
transfer, scheduled cleanup with Cron Triggers, and the durable pending-blob
cleanup records that the later uploads and import steps will also write to.
The Settings/Team UI is done by a later frontend step.

Current code: `src/services/auth.ts`, `src/services/team.ts`, `src/lib/rbac.ts`
(`authMiddleware`, `resolveAthlete`, `c.get("sessionId")`), `src/routes/auth.ts`,
`src/routes/coach.ts`, `src/db/schema.ts` (partial unique owner index, FKs with
ON DELETE CASCADE / SET NULL), `src/index.ts`, `wrangler.toml`.

DO:
1. Schema, one new drizzle-kit migration (`npm run db:generate`, next number; never
   edit applied migrations): `users.deactivated_at` (nullable `timestamp_ms`);
   a durable blob-cleanup table (pending R2 keys with attempts/last error, NOT
   foreign-keyed to users so records survive user deletion). Keep FK and owner
   index invariants; update the explicit-column invite-accept insert in
   `src/services/auth.ts` for the changed user schema while retaining the
   `changes() = 1` guard and concurrent-claim protection. `npm run db:check` passes.
2. Endpoints, thin routes with `validateJson` + shared schemas in `src/lib/validation.ts`
   and logic in services:
   - `POST /api/auth/password` `{ currentPassword, newPassword }`: verify current
     password, then atomically (one `db.batch`) update the hash conditioned on the
     hash that was verified and delete every other session, keeping
     `c.get("sessionId")`; stale verification -> 409.
   - `POST /api/auth/logout-all`: delete all the user's sessions, clear the cookie.
   - `DELETE /api/auth/account` `{ password }`: owner -> 409 "Transfer ownership
     before deleting your account"; last active coach -> 409 (explicit check);
     otherwise one batch deletes the user (cascades) and inserts cleanup records
     for every R2 key the user's own attachments referenced; clear the cookie
     immediately; attempt cleanup promptly via `waitUntil` AND rely on the
     scheduled job for retries. Never delete R2 before the DB commit. Deleting a
     non-owner coach leaves athletes and coach-uploaded files intact, nulls
     `invited_by`/`created_by`, keeps unexpired athlete invites usable; creatorless
     coach invites stay unusable. Guards for owner/last-coach must be atomic
     inside the batch (conditional delete), not just a pre-read.
   - `POST /api/coach/athletes/:athleteId/deactivate` (sets `deactivated_at` and
     deletes that athlete's sessions in one batch) and `.../reactivate`; both
     idempotent; `resolveAthlete` still matches athletes only (coach -> 404).
   - `authMiddleware` rejects deactivated users (401). Login for a deactivated
     user returns the generic "Invalid username or password" with comparable
     password work. Guard session creation against login/deactivation races
     (insert the session conditioned on `deactivated_at IS NULL`).
   - `GET /api/coach/athletes` excludes deactivated athletes by default;
     `?include=deactivated` includes them with a flag. Coach plan endpoints keep
     working for deactivated athletes. Usernames stay reserved.
   - `POST /api/auth/owner/transfer` `{ coachId, password }`: owner only; target
     must be an active coach; one `db.batch` clears `is_owner` on the caller only
     if a valid target exists and the caller is still owner, then sets it on the
     target conditioned on the clear having happened; if the second update
     changes zero rows, the batch must not leave zero owners (design the
     statements so that cannot happen, for example by making the clear itself
     conditional on the target row's eligibility via a subquery and the set
     conditional on the caller now being non-owner and the target still eligible,
     then verifying `changes()` and returning 409 on a stale transfer). Prove with
     a test that concurrent transfers/deletes leave exactly one owner.
   - Add the short per-acting-user rate limit from the shared limiter to
     password verification in the password/delete/transfer endpoints.
   - Add `isOwner`/deactivated info to `/api/auth/me` and `publicUser` as needed
     without breaking existing response fields.
3. Scheduled cleanup: Cron Triggers in `wrangler.toml` for production and preview
   (document the UTC schedule in a comment) and a `scheduled` handler in
   `src/index.ts` that, in bounded batches: deletes expired `sessions`; deletes
   invites used more than 30 days ago or unused and expired more than 30 days
   ago; retries pending R2 deletions idempotently, removing a record only after
   success and never deleting a key that is still referenced by an attachment
   row. Put the job logic in a service (for example `src/services/cleanup.ts`)
   with an exported function that tests can call directly with `env`, and an
   exported helper `enqueueBlobCleanup(...)`-style API that returns the
   statements to include in a caller's batch, for the uploads and import steps.
4. Update `test/worker/helpers.ts` `resetStorage` if needed for the new tables,
   and add proof tests (for example `test/worker/lifecycle.test.ts`) covering:
   password change keeps the current session and revokes others; logout-all;
   account deletion rules (owner 409, last coach 409, non-owner coach deletion
   preserves athletes and their invites); deactivate/reactivate incl. 401 on the
   next request, hidden by default, `?include=deactivated`, idempotency, coach
   target 404; ownership transfer happy path and invalid targets; scheduled
   cleanup boundaries. The test step adds the full matrix later; keep yours
   focused but real.

DO NOT:
- Do not touch `frontend/`, `aspec/`, `README.md` or `.awman/`.
- Do not implement sections 2 or 3 (import, uploads) beyond exposing the cleanup
  API; do not change `src/services/dashboard.ts` or `src/services/transfer.ts`.
- Never use `db.transaction()`; never separate awaited parent/child writes where
  atomicity is required.

Success criteria:
- `npm run typecheck`, `npm run lint`, `npm run db:check`, `npm test` and
  `npm run build` pass.
- `npx wrangler deploy --dry-run --env preview` accepts the cron trigger config
  (or at least the config parses).
- After any sequence of transfer/delete calls in your tests,
  `SELECT count(*) FROM users WHERE is_owner = 1` is exactly 1.

Before finishing, write `/awman/context/workflow/04-lifecycle-api.md`: every
endpoint added or changed (method, path, body, response, status codes), the
deactivation and ownership rules as implemented, the cleanup-record API and how
callers include it in their batch, the cron schedule, the migration's decisions,
and anything the frontend, uploads, import, docs and test steps must know.

Work item (full text; also at aspec/work-items/{{work_item_number}}-security-hardening.md):
{{work_item_content}}
'''

[[step]]
name = "uploads"
agent = "codex"
depends_on = ["lifecycle"]
prompt = '''
You are working on work item {{work_item_number}} (security hardening) in the Do
Good Arching repository. Read `/awman/context/workflow/01-auth-rate-limits.md`,
`/awman/context/workflow/03-request-hardening.md` and
`/awman/context/workflow/04-lifecycle-api.md` first. This step delivers the
BACKEND of section 3 (file uploads, H4) and the upload part of section 9 (error
leakage, M6). The frontend transport change is done by a later step from the
contract you write down.

Current code: `src/services/attachments.ts` (`addPlannedSessionFileFor` decodes
base64 from JSON, 8,000,000-byte cap, `fileDownloadHeaders`,
`buildContentDisposition` in `src/lib/http.ts`), upload routes in
`src/routes/tracker.ts` and `src/routes/coach.ts`, schemas in
`src/lib/validation.ts`, `src/db/schema.ts` + `migrations/`.

DO:
1. Transport: replace base64-in-JSON with a raw file body plus validated metadata
   in headers/query (recommended: `PUT`/`POST` with the file as the body,
   `Content-Type` = file MIME, metadata such as label/dayKey in query or `X-`
   headers), or genuinely streaming multipart parsing. Do NOT buffer the whole
   file via `formData()`/`arrayBuffer()`. Reject a declared oversize
   `Content-Length` before reading; also count actual streamed bytes with a
   `TransformStream`, enforce the 8,000,000-byte cap mid-stream, and reject
   truncated/mismatched bodies. Define the missing-`Content-Length` path
   explicitly (R2 `put` needs a known length for streams: either require the
   header, or use a fixed-length/`FixedLengthStream` design, or buffer only up to
   the cap in bounded chunks; document the choice and its memory bound). Browser
