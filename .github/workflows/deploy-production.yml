# Manual deployment to *production* (the top-level config in wrangler.toml).
#
# Trigger it from the Actions tab ("Run workflow") with the commit SHA to
# release; it defaults to the current tip of main. Releases are trunk-based:
# the git SHA identifies the release, the package.json version is not used.
#
# The `production` GitHub environment must be configured in the repository
# settings with "Required reviewers", so the deploy job waits for approval
# before it can read the secrets and run. Required *environment* secrets
# (environment: "production"):
#   CLOUDFLARE_API_TOKEN   API token scoped to this account with:
#                            - Workers Scripts: Edit   (deploy the Worker)
#                            - D1: Edit                (apply migrations)
#                            - Workers R2 Storage: Edit (R2 binding validation)
#   CLOUDFLARE_ACCOUNT_ID  The Cloudflare account ID that owns the Worker.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (leave empty for the current tip of main)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || 'main' }}
      - id: resolve
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Deploying ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  checks:
    name: Typecheck, lint, test, build
    needs: resolve
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run db:check
      - run: npm test
      - run: npm run build

  deploy:
    name: Migrate and deploy to production
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    # Waits for the reviewers configured on the `production` environment.
    environment:
      name: production
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Migrations first, so the new Worker never runs against an old schema.
      # Take a backup beforehand if the migration is destructive; D1 Time
      # Travel can restore the database to any point in the last 30 days.
      - name: Apply D1 migrations (production)
        run: npm run db:migrate

      - name: Deploy Worker (production)
        run: >-
          npx wrangler deploy
          --tag "${DEPLOY_SHA}"
          --message "release ${DEPLOY_SHA::7} (${GITHUB_RUN_ID})"
