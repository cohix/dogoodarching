# Continuous deployment to the *preview* environment.
# On every push to main: run the full checks, apply pending D1 migrations to
# the preview database, then deploy the Worker to the preview environment
# (`[env.preview]` in wrangler.toml). The deployed version is tagged with the
# git SHA so a deploy can be traced to its commit.
#
# Required GitHub *environment* secrets (environment: "preview"):
#   CLOUDFLARE_API_TOKEN   API token scoped to this account with:
#                            - Workers Scripts: Edit   (deploy the Worker)
#                            - D1: Edit                (apply migrations)
#                            - Workers R2 Storage: Edit (R2 binding validation)
#                          Wrangler uses the token directly; no `wrangler login`.
#   CLOUDFLARE_ACCOUNT_ID  The Cloudflare account ID that owns the Worker.
name: Deploy preview

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never run two preview deploys at once; let the older one finish.
concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run db:check
      - run: npm test
      - run: npm run build

  deploy:
    name: Migrate and deploy to preview
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: preview
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Migrations first, so the new Worker never runs against an old schema.
      - name: Apply D1 migrations (preview)
        run: npm run db:migrate:preview

      - name: Deploy Worker (preview)
        run: >-
          npx wrangler deploy --env preview
          --tag "${GITHUB_SHA}"
          --message "main@${GITHUB_SHA::7} (${GITHUB_RUN_ID})"
