# Cloudflare Workers configuration for Do Good Arching.
#
# Deploys are run by Cloudflare (Workers Builds), not GitHub Actions.
#
# SETTING UP A NEW ACCOUNT (the IDs below belong to this project's account):
#   1. npx wrangler d1 create dogoodarching
#      -> paste the returned database_id below
#   2. npx wrangler r2 bucket create dogoodarching-attachments
#   3. npm run db:migrate   (applies migrations/ to the remote D1 database)

name = "dogoodarching"
main = "src/index.ts"
compatibility_date = "2026-09-25"

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
# API routes must hit the Worker first; otherwise the SPA fallback would
# serve index.html for /api/* requests.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dogoodarching"
database_id = "0a768d12-55d5-4446-9a2d-4d3b14a71353"
# Used by `wrangler d1 migrations apply DB --remote --preview` (db:migrate:preview);
# must match `[[previews.d1_databases]]` below.
preview_database_id = "208493d9-3055-47e3-8bd7-ad0c970204db"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "dogoodarching-attachments"

# Workers Rate Limiting bindings, consumed only by src/lib/rate-limit.ts.
# A binding's limit is fixed, so there is one binding per allowance; the
# limiter picks the binding by operation and prefixes keys (`login:<ip>`,
# `login-user:<username>`, ...). `period` must be 10 or 60. Counters are
# approximate and kept per Cloudflare location. Preview declares the same
# names with different namespace_ids below, so preview counters never share
# state with production. A missing binding fails closed (503). Local
# `wrangler dev` and the vitest plugin simulate these bindings; tests replace
# them with the deterministic mock selected by RATE_LIMIT_MODE (see
# vitest.config.ts), which is never declared here.
[[ratelimits]]
name = "RATE_LIMIT_5_PER_MIN"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_10_PER_MIN"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Scheduled cleanup (src/index.ts `scheduled` -> src/services/cleanup.ts).
# Cron Triggers always run in UTC: every 15 minutes, at :00/:15/:30/:45. Each
# run deletes expired sessions, invites used or expired more than 30 days ago,
# and retries pending R2 deletions (`blob_cleanup`), in bounded batches.
# Production only: `[previews]` has no `triggers` key, so preview runs no cron.
[triggers]
crons = ["*/15 * * * *"]

# ---------------------------------------------------------------------------
# Preview deployments (`wrangler preview` / `npm run deploy:preview`) of the
# same Worker. They get their own D1 database and R2 bucket so preview data
# never touches production. The top-level config above is production.
#
# SETTING UP A NEW ACCOUNT:
#   1. npx wrangler d1 create dogoodarching-preview
#      -> paste the returned database_id below AND into `preview_database_id`
#         on the top-level [[d1_databases]]
#   2. npx wrangler r2 bucket create dogoodarching-attachments-preview
#   3. npm run db:migrate:preview

[[previews.d1_databases]]
binding = "DB"
database_name = "dogoodarching-preview"
database_id = "208493d9-3055-47e3-8bd7-ad0c970204db"

[[previews.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "dogoodarching-attachments-preview"

# Same binding names as production, distinct namespace_ids (separate counters).
[[previews.ratelimits]]
name = "RATE_LIMIT_5_PER_MIN"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[previews.ratelimits]]
name = "RATE_LIMIT_10_PER_MIN"
namespace_id = "2002"
simple = { limit = 10, period = 60 }
